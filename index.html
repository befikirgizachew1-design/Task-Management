<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task management</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">STAY ORGANIZED</p>
        <h1>My Task Manager</h1>
        <p>Plan your work, track your progress, and get things done.</p>
      </header>

      <section class="statistics" aria-label="Task statistics">
        <article class="stat-card">
          <span>Total Tasks</span>
          <strong id="total-count">0</strong>
        </article>
        <article class="stat-card">
          <span>Completed</span>
          <strong id="completed-count">0</strong>
        </article>
        <article class="stat-card">
          <span>Pending</span>
          <strong id="pending-count">0</strong>
        </article>
        <article class="stat-card">
          <span>High Priority</span>
          <strong id="high-count">0</strong>
        </article>
      </section>

      <section class="panel">
        <h2 id="form-heading">Add a New Task</h2>

        <form id="task-form">
          <label for="task-title">Task title</label>
          <input
            id="task-title"
            name="title"
            type="text"
            maxlength="100"
            placeholder="e.g. Study JavaScript functions"
            required
          />

          <label for="task-category">Category</label>
          <select id="task-category" name="category" required>
            <option value="study">Study</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="other">Other</option>
          </select>

          <label for="task-priority">Priority</label>
          <select id="task-priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>

          <label for="task-date">Due date</label>
          <input id="task-date" name="dueDate" type="date" required />

          <div class="form-actions">
            <button id="submit-button" type="submit">Add Task</button>
            <button id="cancel-edit" class="secondary hidden" type="button">
              Cancel Edit
            </button>
          </div>
          <p id="form-error" class="error-message" role="alert"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Your Tasks</h2>

        <label for="search-input">Search tasks</label>
        <input
          id="search-input"
          type="search"
          placeholder="Search by task title..."
        />

        <div class="filters" aria-label="Filter tasks">
          <button
            class="filter-button active"
            data-filter="all"
            aria-pressed="true"
          >
            All
          </button>
          <button
            class="filter-button"
            data-filter="completed"
            aria-pressed="false"
          >
            Completed
          </button>
          <button
            class="filter-button"
            data-filter="pending"
            aria-pressed="false"
          >
            Pending
          </button>
        </div>

        <p id="task-count" class="task-count">0 tasks</p>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-message" class="empty-message">
          No tasks yet. Add your first task above!
        </p>
      </section>

      <footer>
        <p>Your tasks are saved in this browser using LocalStorage.</p>
      </footer>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
